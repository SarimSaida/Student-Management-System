<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let students = (JSON.parse(localStorage.getItem("Students")) || []);
            let body = document.querySelector("tbody");
            for (const a of students) {
                body.innerHTML += (`<tr><td>${a.id}</td><td>${a.name}</td><td>${a.branch}</td><td>${a.cgpa}</td>
                <td><input type="button" onclick="window.location.href='edit.html?id=${a.id}'" value="Edit">
                <input type="button" onclick="deleteUser('${a.id}')" value="Delete"></td>
            </tr>`);
            }
        });
    </script>
</head>

<body>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="add-student.html">Add Student</a>
        <a href="view-students.html">View Students</a>
        <a href="logout.html">Logout</a>
    </nav>
    <br>
    <h1>Students List</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Branch</th>
                <th>CGPA</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            
        </tbody>
    </table>
</body>

</html>
