<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        function registerUser(event) {
            event.preventDefault();

            let username = document.getElementById("username").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let c_password = document.getElementById("c_password").value;

            let userRegex = /^[a-zA-Z0-9]{8,12}$/;
            if (!userRegex.test(username)) {
                alert("Username must be at least 8 characters and maximum 12 characters, using only letters and digits.");
                return;
            }

            let passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,13}$/;
            if (!passwordRegex.test(password)) {
                alert("Password must be at least 8 characters and include uppercase, lowercase, number, and special character. Example: rAvi@123");
                return;
            }

            if (password !== c_password) {
                alert("Passwords do not match");
                return;
            }

            const userDetails = {
                name: username,
                email: email,
                pwd: password
            };

            localStorage.setItem(username, JSON.stringify(userDetails));
            window.location.href = "login.html";
        }
    </script>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
    <h1>Register your Account</h1>
    <form onsubmit="registerUser(event)">
        <label for="username">Username</label>
        <input id="username" type="text" required>
        <br>
        <label for="email">Email</label>
        <input id="email" type="email" required>
        <br>
        <label for="password">Password</label>
        <input id="password" type="password" required>
        <br>
        <label for="c_password">Confirm Password</label>
        <input id="c_password" type="password" required>
        <br>
        <input type="submit" value="Register">
    </form>
    <p>Already have an account? Click <a href="login.html">here</a> to login</p>
</body>
</html>
